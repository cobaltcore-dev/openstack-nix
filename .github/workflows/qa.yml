name: QA
on: [ pull_request ]
jobs:
  flake-check:
    name: Nix Flake Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Nix Flake Checks
        run: nix flake check --all-systems
  nixos-tests:
    runs-on: large_runner_16core_64gb
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          enable_kvm: true
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - name: Build
        run: |
          set -euxo pipefail
          nix build --show-trace \
            --option max-jobs 1 \
            --option cores 4 \
            .#tests.x86_64-linux.openstack-default-setup.driver &
          nix_pid=$!

          while kill -0 "$nix_pid" 2>/dev/null; do
            echo "=== $(date -Is) process snapshot ==="
            ps -eo pid,ppid,stat,etime,pcpu,pmem,args \
              | egrep 'nix|gcc|cc1|ld|make|uwsgi|python|systemd|bash' \
              | grep -v egrep || true
            sleep 60
          done
          wait "$nix_pid"
      - name: Basic setup
        run: |
          nix run .#tests.x86_64-linux.openstack-default-setup.driver
      - name: Live migration
        run: |
          nix run .#tests.x86_64-linux.openstack-live-migration.driver
