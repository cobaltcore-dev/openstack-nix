name: QA
on: [ pull_request ]
permissions:
  contents: read
jobs:
  flake-check:
    name: Nix Flake Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Nix Flake Checks
        run: nix flake check --all-systems
  nixos-basic-test:
    runs-on: large_runner_16core_64gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: openstack-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        run: |
          set -euxo pipefail
          nix build --show-trace \
            --option max-jobs 1 \
            --option cores 4 \
            .#tests.x86_64-linux.openstack-default-setup.driver
      - name: Basic setup
        run: |
          nix run .#tests.x86_64-linux.openstack-default-setup.driver
  nixos-live-migration-test:
    runs-on: large_runner_16core_64gb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: openstack-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        run: |
          set -euxo pipefail
          nix build --show-trace \
            --option max-jobs 1 \
            --option cores 4 \
            .#tests.x86_64-linux.openstack-live-migration.driver
      - name: Live migration
        run: |
          nix run .#tests.x86_64-linux.openstack-live-migration.driver
